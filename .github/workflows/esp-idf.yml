name: ESP-IDF build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ESP32-P4 / pinned ESP-IDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned ESP-IDF
        run: ./scripts/setup-codex.sh

      - name: Build firmware
        run: ./scripts/build-p4.sh

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vox-p4-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/vox_p4.bin
            build/flash_args
            build/flasher_args.json
            build/project_description.json
          if-no-files-found: error
          retention-days: 14

  voxlink-contract:
    name: VoxLink contract / schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate VoxLink schema artifacts
        run: python tools/export_voxlink_schema.py

      - name: Validate generated JSON schema
        run: python tools/check_voxlink_schema.py

      - name: Fail if generated artifacts are stale
        run: |
          if ! git diff --exit-code -- integration/; then
            echo "::error::VoxLink generated artifacts are stale. Run 'python tools/export_voxlink_schema.py' and commit the outputs in integration/."
            exit 1
          fi

      - name: Configure host tests
        run: cmake -S tests -B build-host

      - name: Build VoxLink host tests
        run: |
          cmake --build build-host --target \
            voxlink_registry_tests \
            voxlink_schema_tests \
            voxlink_framing_tests \
            voxlink_fuzz_tests \
            voxlink_state_sync_tests \
            voxlink_concurrency_tests \
            voxlink_golden_tests \
            voxlink_protocol_conformance_tests \
            voxlink_binding_tests \
            voxlink_coherence_tests

      - name: Run VoxLink host tests
        run: ctest --test-dir build-host -R voxlink --output-on-failure

  wasm-preview:
    name: WebAssembly DSP Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure WebAssembly build
        run: emcmake cmake -S wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Compile WebAssembly target
        run: cmake --build build-wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test WASM provenance logic
        run: node --test scripts/lib/provenance.test.mjs

      - name: Check out editor parameter contract
        uses: actions/checkout@v4
        with:
          repository: ovelhaaa/voxP4-editor
          path: voxP4-editor

      - name: Generate DSP compatibility manifest
        run: node scripts/generate-manifest.mjs

      - name: Upload WASM preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxp4-wasm-preview
          path: |
            build-wasm/voxp4-preview.wasm
            build-wasm/voxp4-preview.mjs
            build-wasm/dsp-compatibility.json
          if-no-files-found: error
          retention-days: 14

