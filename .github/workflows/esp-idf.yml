name: ESP-IDF build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ESP32-P4 / pinned ESP-IDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned ESP-IDF
        run: ./scripts/setup-codex.sh

      - name: Build firmware
        run: ./scripts/build-p4.sh

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vox-p4-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/vox_p4.bin
            build/flash_args
            build/flasher_args.json
            build/project_description.json
          if-no-files-found: error
          retention-days: 14
